<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5ebe7e">
<title>Listmate</title>
<script type="text/javascript" src="https://appleid.cdn.apple.com/appleauth/static/js/issuer/v1/token.js" onload="if(window.initAppleID)initAppleID()"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Roboto, sans-serif; background: #f0f4ed; min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 20px; padding: 40px 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; max-width: 380px; width: 90%; }
  #subtitle { font-size: 14px; color: #888; margin-bottom: 28px; }
  .step { display: none; } .step.active { display: block; }
  .step h2 { font-size: 16px; margin-bottom: 8px; color: #2c5a2c; }
  label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; margin-top: 16px; text-align: left; }
  input[type=text] { width: 100%; padding: 12px 14px; font-size: 16px; border: 1.5px solid #d8e0d0; border-radius: 10px; outline: none; }
  input[type=text]:focus { border-color: #5ebe7e; }
  .btn { display: block; width: 100%; padding: 14px; margin-top: 20px; background: #5ebe7e; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn:disabled { opacity: 0.5; }
  .error { color: #d94a4a; font-size: 13px; margin-top: 10px; display: none; }
  .back-link { text-align: center; margin-top: 14px; } .back-link a { font-size: 13px; color: #5ebe7e; text-decoration: none; }
  .invite-banner { background: #e8f5e9; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
  .invite-banner .household { font-weight: 700; color: #2c5a2c; font-size: 16px; margin-bottom: 4px; }
  .invite-banner .desc { font-size: 13px; color: #555; }
  .privacy-note { font-size: 12px; color: #aaa; margin-top: 20px; line-height: 1.5; border-top: 1px solid #eee; padding-top: 16px; }
  .signin-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 280px; padding: 10px 16px; border: 1px solid #dadce0; border-radius: 8px; background: #fff; text-decoration: none; font-size: 14px; font-weight: 500; color: #3c4043; box-shadow: 0 1px 2px rgba(0,0,0,0.08); cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>🛒 Listmate</h1>
  <p id="subtitle">Store-smart grocery lists for your household</p>
  <div id="error" class="error"></div>
  <div id="step1" class="step active">
    <div id="loadingState" style="text-align:center; padding: 20px; color: #888; font-size: 14px;">Checking session...</div>
    <div id="authButtonsContainer" style="margin-top:16px; display:none; flex-direction:column; gap:12px; align-items:center;">
      <button id="btnGoogle" onclick="doSignIn()" class="signin-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.95 16.46 0 20.12 0 24s.95 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Sign in with Google
      </button>
      <button id="btnApple" onclick="doAppleSignIn()" class="signin-btn" style="background:#000; color:#fff; border:none;">
        <svg width="18" height="18" viewBox="0 0 170 170" style="fill:#fff"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.94.13-9.86-1.95-14.75-6.23-3.17-2.63-7.06-7.27-11.68-13.91-6.13-8.82-11.05-18.66-14.76-29.53-3.71-10.87-5.57-21.36-5.57-31.47 0-14.28 3.69-25.92 11.07-34.93 7.38-9 16.59-13.56 27.63-13.68 4.82 0 10.13 1.22 15.93 3.66 5.8 2.45 9.87 3.67 12.22 3.67 2.12 0 6.27-1.28 12.46-3.84 6.19-2.56 11.45-3.78 15.78-3.66 12.02.5 21.84 5.06 29.47 13.68-10.65 6.4-15.85 15.34-15.6 26.83.25 9.02 3.63 16.59 10.13 22.7 6.5 6.11 14.3 9.61 23.4 10.5-.88 5.12-2.31 10.36-4.3 15.72zM119.22 31.02c0-7.02 2.53-13.62 7.59-19.8 5.06-6.18 11.38-9.8 18.96-10.86.37 1.12.56 2.18.56 3.18 0 7.02-2.59 13.62-7.78 19.8-5.18 6.18-11.41 9.8-18.69 10.86-.25-1.06-.64-2.12-.64-3.18z"/></svg>
        Sign in with Apple
      </button>
    </div>
  </div>
  <div id="step2" class="step">
    <div id="inviteBanner" class="invite-banner" style="display:none">
      <div class="household" id="inviteHousehold"></div>
      <div class="desc" id="inviteDesc"></div>
    </div>
    <div id="createSection">
      <h2>Set up your household</h2>
      <label for="householdName">Household Name</label>
      <input type="text" id="householdName" placeholder="e.g. Raghav household" maxlength="60">
      <button class="btn" id="btnCreate" onclick="createHousehold()">Create Household</button>
    </div>
    <button class="btn" id="btnAccept" onclick="acceptInvite()" style="display:none">Accept Invitation</button>
    <div class="error" id="step2Error"></div>
    <div class="back-link"><a href="#" onclick="goToStep1()">← Start over</a></div>
  </div>
  <div class="privacy-note">🔒 Only members of your household can see your list.</div>
</div>

<script>
var CLIENT_ID = '526061928190-8si99s2n17u7onf8mo2uapfjphtopnc1.apps.googleusercontent.com';
var inviteToken = (new URLSearchParams(window.location.search)).get('token') || sessionStorage.getItem('listmate_invite');
if (inviteToken) sessionStorage.removeItem('listmate_invite');
var googleCredential = null;

function checkSessionAndProceed(proceedFn) {
  var b1 = document.getElementById('btnGoogle');
  var b2 = document.getElementById('btnApple');
  if(b1) b1.disabled = true;
  if(b2) b2.disabled = true;
  fetch('/api/auth/config?_='+Date.now()).then(function(r) {
    if (r.ok) {
      r.json().then(function(c) {
        if (c.user) { location.replace('/'); } else { if(b1) b1.disabled=false; if(b2) b2.disabled=false; proceedFn(); }
      });
    } else { if(b1) b1.disabled=false; if(b2) b2.disabled=false; proceedFn(); }
  }).catch(function() { if(b1) b1.disabled=false; if(b2) b2.disabled=false; proceedFn(); });
}


// Direct JavaScript navigation — Capacitor respects allowNavigation for user-initiated navigations
function doSignIn() {
  checkSessionAndProceed(function() {
    _doSignIn();
  });
}

var activePoll = null;
function startPollingIntent(intentId) {
  if (activePoll) clearInterval(activePoll);
  activePoll = setInterval(function() {
    fetch('/api/auth/poll?intent=' + encodeURIComponent(intentId))
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok) {
          clearInterval(activePoll);
          location.replace('/');
        }
      }).catch(function(){});
  }, 2000);
}

function _doSignIn() {
  if (inviteToken) { sessionStorage.setItem('listmate_invite', inviteToken); }
  var nonce = Math.random().toString(36).slice(2);
  var intentId = Math.random().toString(36).slice(2) + Date.now().toString(36);
  startPollingIntent(intentId);
  var url = 'https://accounts.google.com/o/oauth2/v2/auth?' +
    'client_id=' + CLIENT_ID +
    '&redirect_uri=' + encodeURIComponent(location.origin + '/login') +
    '&response_type=id_token' +
    '&scope=openid%20email%20profile' +
    '&nonce=' + nonce + '&state=intent_' + intentId;
  window.location.assign(url);
}

// Check for session or redirect callback
(function() {
  try {
    fetch('/api/auth/config?_='+Date.now()).then(function(r) {
      if (r.ok) r.json().then(function(c) { if (c.user) { location.replace('/'); } else { document.getElementById('loadingState').style.display = 'none'; document.getElementById('authButtonsContainer').style.display = 'flex'; } }); else { document.getElementById('loadingState').style.display = 'none'; document.getElementById('authButtonsContainer').style.display = 'flex'; }
    });
  } catch(e) { document.getElementById('loadingState').style.display = 'none'; document.getElementById('authButtonsContainer').style.display = 'flex'; }

  var appleToken = sessionStorage.getItem('apple_id_token');
  if (appleToken) {
    sessionStorage.removeItem('apple_id_token');
    var userStr = sessionStorage.getItem('apple_user');
    sessionStorage.removeItem('apple_user');
    var stateStr = sessionStorage.getItem('apple_state');
    sessionStorage.removeItem('apple_state');
    if (stateStr && stateStr.startsWith('intent_')) { currentIntentId = stateStr.substring(7); }
    var userObj = null;
    if (userStr) {
      try { userObj = JSON.parse(userStr); } catch(e) {}
    }
    handleAppleCredential(appleToken, userObj);
    return;
  }

  var hp = new URLSearchParams(window.location.hash.substring(1));
  var idToken = hp.get('id_token');
  var st = hp.get('state');
  if (st && st.startsWith('intent_')) { currentIntentId = st.substring(7); }
  if (idToken) {
    history.replaceState(null, '', location.pathname + location.search);
    handleCredential(idToken);
  }
})();

function getAppleClientId() {
  var cid = 'APPLE_CLIENT_ID_PLACEHOLDER';
  if (!cid || cid === 'APPLE_CLIENT_ID_PLACEHOLDER') {
    return 'com.pvkslabs.listmate.web';
  }
  return cid;
}

function initAppleID() {
  if (false) { // Disabled popup auth to force redirect in WebView
    try {
      AppleID.auth.init({
        clientId: getAppleClientId(),
        scope: 'name email',
        redirectURI: location.origin + '/login',
        usePopup: true
      });
    } catch(e) {}
  }
}

document.addEventListener('DOMContentLoaded', initAppleID);

var currentIntentId;
function redirectToAppleOAuth() {
  currentIntentId = Math.random().toString(36).slice(2) + Date.now().toString(36);
  startPollingIntent(currentIntentId);
  var state = 'intent_' + currentIntentId + '_web';
  var url = 'https://appleid.apple.com/auth/authorize?' +
    'client_id=' + encodeURIComponent(getAppleClientId()) +
    '&redirect_uri=' + encodeURIComponent(location.origin + '/login') +
    '&response_type=code%20id_token' +
    '&scope=name%20email' +
    '&response_mode=form_post' +
    '&state=' + state;
  window.location.assign(url);
}

function doAppleSignIn() {
  checkSessionAndProceed(function() {
    _doAppleSignIn();
  });
}
function _doAppleSignIn() {
  currentIntentId = Math.random().toString(36).slice(2) + Date.now().toString(36);
  startPollingIntent(currentIntentId);
  if (inviteToken) { sessionStorage.setItem('listmate_invite', inviteToken); }

  if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.SignInWithApple) {
    window.Capacitor.Plugins.SignInWithApple.authorize({
      clientId: getAppleClientId(),
      redirectURI: location.origin + '/login',
      state: 'intent_' + currentIntentId,
      scopes: 'email name'
    }).then(function(res) {
      var idToken = res.response.identityToken;
      var userObj = null;
      if (res.response.givenName || res.response.familyName || res.response.email) {
        userObj = {
          name: {
            firstName: res.response.givenName || '',
            lastName: res.response.familyName || ''
          },
          email: res.response.email || ''
        };
      }
      handleAppleCredential(idToken, userObj);
    }).catch(function(err) {
      console.warn('[Native AppleID Sign-In error]', err);
    });
    return;
  }

  if (window.AppleID && window.AppleID.auth) {
    try {
      AppleID.auth.init({
        clientId: getAppleClientId(),
        scope: 'name email',
        redirectURI: location.origin + '/login',
        usePopup: true
      });
      AppleID.auth.signIn().then(function(res) {
        if (res && res.authorization && res.authorization.id_token) {
          handleAppleCredential(res.authorization.id_token, res.user);
        }
      }).catch(function(err) {
        console.warn('[AppleID Sign-In error]', err);
        var errStr = typeof err === 'string' ? err : (err && (err.error || err.message)) || '';
        if (errStr === 'popup_closed_by_user' || errStr === 'user_cancelled') {
          return;
        }
        if (errStr === 'invalid_client' || errStr === 'invalid_request') {
          showError('Apple Sign-In is being configured. Please ensure your Services ID (' + getAppleClientId() + ') is registered in Apple Developer Console for ' + location.host);
          return;
        }
        redirectToAppleOAuth();
      });
      return;
    } catch(e) {
      console.warn('[AppleID Init exception]', e);
    }
  }

  redirectToAppleOAuth();
}

function handleAppleCredential(idToken, userObj) {
  showError('');
  fetch('/api/auth/apple', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id_token: idToken, user: userObj, intent: (typeof currentIntentId !== 'undefined' ? currentIntentId : null)})
  }).then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d, status: r.status}; }); })
  .then(function(r) {
    if (r.data.ok) {
      if (inviteToken) {
        fetch('/api/auth/invite/'+inviteToken+'/accept',{method:'POST'}).then(function(){location.replace('/');});
      } else {
        location.replace('/');
      }
      return;
    }
    if (r.data.needs_signup) {
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
      if (inviteToken) { showInviteBanner(); } else {
        document.getElementById('createSection').style.display='block';
        document.getElementById('btnAccept').style.display='none';
      }
      return;
    }
    showError(r.data.error||('Server error ('+r.status+')'));
  }).catch(function() { showError('Network error. Try again.'); });
}

function handleCredential(credential) {
  googleCredential = credential;
  showError('');
  fetch('/api/auth/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({credential: credential, intent: (typeof currentIntentId !== 'undefined' ? currentIntentId : null)})
  }).then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d, status: r.status}; }); })
  .then(function(r) {
    if (r.data.ok) {
      if (inviteToken) {
        fetch('/api/auth/invite/'+inviteToken+'/accept',{method:'POST'}).then(function(){location.replace('/');});
      } else {
        location.replace('/');
      }
      return;
    }
    if (r.data.needs_signup) {
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
      if (inviteToken) { showInviteBanner(); } else {
        document.getElementById('createSection').style.display='block';
        document.getElementById('btnAccept').style.display='none';
      }
      return;
    }
    showError(r.data.error||('Server error ('+r.status+')'));
  }).catch(function() { showError('Network error. Try again.'); });
}

function showInviteBanner() {
  fetch('/api/auth/invite/'+inviteToken).then(function(r){return r.json()}).then(function(d){
    if (d.valid) {
      document.getElementById('inviteBanner').style.display='block';
      document.getElementById('inviteHousehold').textContent=d.household_name;
      document.getElementById('inviteDesc').textContent=d.email?('Invited as '+d.email):'You have been invited';
      document.getElementById('createSection').style.display='none';
      document.getElementById('btnAccept').style.display='block';
      document.getElementById('subtitle').textContent='Accept your invitation';
    } else { showStep2Error(d.error||'Invalid invite'); }
  }).catch(function(){ showStep2Error('Could not verify invite.'); });
}

function acceptInvite() {
  var b=document.getElementById('btnAccept'); b.disabled=true; showStep2Error('');
  fetch('/api/auth/invite/'+inviteToken+'/accept',{method:'POST'}).then(function(r){return r.json()}).then(function(d){
    if(d.ok) location.replace('/'); else showStep2Error(d.error||'Failed');
  }).catch(function(){ showStep2Error('Network error.'); });
  b.disabled=false;
}

function createHousehold() {
  var n=document.getElementById('householdName').value.trim();
  if(!n){showStep2Error('Enter a household name');return;}
  var b=document.getElementById('btnCreate'); b.disabled=true; showStep2Error('');
  fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({household_name:n})})
    .then(function(r){return r.json()}).then(function(d){
    if(d.ok) location.replace('/'); else showStep2Error(d.error||'Failed');
  }).catch(function(){ showStep2Error('Network error.'); });
  b.disabled=false;
}

function goToStep1() {
  googleCredential=null;
  document.getElementById('step2').classList.remove('active');
  document.getElementById('step1').classList.add('active');
  document.getElementById('householdName').value='';
  document.getElementById('step2Error').style.display='none';
  document.getElementById('inviteBanner').style.display='none';
  document.getElementById('createSection').style.display='block';
  document.getElementById('btnAccept').style.display='none';
  document.getElementById('subtitle').textContent='Store-smart grocery lists for your household';
}

function showError(m){var e=document.getElementById('error');e.textContent=m;e.style.display=m?'block':'none';}
function showStep2Error(m){var e=document.getElementById('step2Error');e.textContent=m;e.style.display=m?'block':'none';}
</script>
<script src="/static/auth-ui.js"></script>
</body>
</html>
