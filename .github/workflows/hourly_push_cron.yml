name: Hourly Push Notification Cron

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        type: choice
        default: 'staging'
        options:
          - staging
          - production
      dry_run:
        description: 'Run in Dry Run mode (evaluate candidates without dispatching pushes)'
        required: false
        type: boolean
        default: false
      force_send:
        description: 'Force test candidates now (bypass 8:00 AM local time restriction)'
        required: false
        type: boolean
        default: false
      target_hour:
        description: 'Target local hour to evaluate (0-23, or 8 for production standard)'
        required: false
        type: string
        default: '8'

jobs:
  trigger_hourly_push:
    name: Trigger Hourly Push Cron
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Target URL
        id: target
        run: |
          BRANCH="${{ github.ref_name }}"
          ENV_INPUT="${{ inputs.environment || github.event.inputs.environment || '' }}"
          echo "Triggered on branch: '$BRANCH', input environment: '$ENV_INPUT'"

          if [ "$ENV_INPUT" = "staging" ] || [ "$BRANCH" = "staging" ]; then
            echo "Target environment resolved to: STAGING"
            echo "url=https://listmate-staging.onrender.com/api/internal/cron/hourly-push" >> $GITHUB_OUTPUT
          else
            echo "Target environment resolved to: PRODUCTION"
            echo "url=https://grocerlist.app/api/internal/cron/hourly-push" >> $GITHUB_OUTPUT
          fi
          echo "dry_run=${{ inputs.dry_run || github.event.inputs.dry_run || 'false' }}" >> $GITHUB_OUTPUT
          echo "force_send=${{ inputs.force_send || github.event.inputs.force_send || 'false' }}" >> $GITHUB_OUTPUT
          echo "target_hour=${{ inputs.target_hour || github.event.inputs.target_hour || '8' }}" >> $GITHUB_OUTPUT

      - name: Dispatch Hourly Push Webhook
        env:
          CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
          TARGET_URL: ${{ steps.target.outputs.url }}
          DRY_RUN: ${{ steps.target.outputs.dry_run }}
          FORCE_SEND: ${{ steps.target.outputs.force_send }}
          TARGET_HOUR: ${{ steps.target.outputs.target_hour }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning ::INTERNAL_CRON_SECRET is not configured in repository secrets. Skipping webhook dispatch."
            exit 0
          fi

          echo "Dispatching hourly push webhook to $TARGET_URL (dry_run=$DRY_RUN, force=$FORCE_SEND, target_hour=$TARGET_HOUR)..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"dry_run\": $DRY_RUN, \"force\": $FORCE_SEND, \"target_hour\": \"$TARGET_HOUR\"}")

          echo "HTTP Response Status: $HTTP_STATUS"
          echo "Response Body:"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Hourly push cron webhook completed successfully."
          else
            echo "::error ::Webhook returned non-2xx status ($HTTP_STATUS)."
            exit 1
          fi
