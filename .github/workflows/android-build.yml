name: Android Build

on:
  push:
    branches:
      - main
      - staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Configure Capacitor for Environment
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "Setting server url to https://listmate-staging.onrender.com"
            sed -i 's|"url": "https://grocerlist.app"|"url": "https://listmate-staging.onrender.com"|g' capacitor.config.json
          else
            echo "Keeping server url as https://grocerlist.app"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: listmate-android-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
